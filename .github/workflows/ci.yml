name: CI

on:
  push:
    branches: [ "main", "integration" ]
  pull_request:
    branches: [ "main", "integration" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-linux:
    name: Test Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libx11-xcb-dev xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libxcursor1 libxrandr2 libxi6 python3-yaml python3-numpy python3-pil

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Rust Cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-linux-

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run installer tests
        run: bash scripts/test-installer.sh

      - name: Build release binary
        run: cargo build --release --locked -p mq-cli

      - name: CLI smoke verification
        run: |
          ./target/release/mq --version
          ./target/release/mq --help >/dev/null
          ./target/release/mq launch --help >/dev/null
          ./target/release/mq about >/dev/null

      - name: Verify no test-hooks in release binary
        run: |
          ! strings ./target/release/mq | grep -qE 'MQ_TEST_(ACTION|MOCK_URL|CANCEL_AFTER_MS|EXIT_ON_FINISH)'

      - name: Build debug binary with test-hooks
        run: cargo build --locked --bin mq --features test-hooks

      - name: Run QA smoke scenario (Xvfb + glow)
        timeout-minutes: 10
        run: |
          ./scripts/qa/xvfb_run.sh --no-fallback -- python3 scripts/qa/run.py --no-build --bin target/debug/mq --backend glow --out-dir "${{ runner.temp }}/qa-smoke" qa/scenarios/smoke.yaml

      - name: Print QA smoke report on failure
        if: failure()
        run: |
          cat "${{ runner.temp }}/qa-smoke/report.md" || true
          cat "${{ runner.temp }}/qa-smoke/smoke/launcher.log" || true
          ls -la "${{ runner.temp }}/qa-smoke/smoke" || true

  test-windows:
    name: Test & Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy

      - name: Rust Cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-win-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-win-

      - name: Clippy workspace (Windows)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Windows Unit Tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build Release mq.exe
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p mq-cli

      - name: Verify static CRT, PE metadata, and application manifest
        shell: pwsh
        run: |
          $exe = ".\target\release\mq.exe"
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "PE CompanyName=$($vi.CompanyName) ProductName=$($vi.ProductName) FileVersion=$($vi.FileVersion)"
          if ($vi.CompanyName -ne "MrQuster") {
            throw "Expected PE CompanyName 'MrQuster', got '$($vi.CompanyName)'"
          }
          $rawText = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($exe))
          if ($rawText -notmatch "<longPathAware[^>]*>true</longPathAware>") {
            throw "mq.exe is missing <longPathAware>true</longPathAware> in embedded Windows manifest"
          }
          if ($rawText -notmatch "<dpiAwareness[^>]*>PerMonitorV2") {
            throw "mq.exe is missing PerMonitorV2 <dpiAwareness> in embedded Windows manifest"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter "dumpbin.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*\Hostx64\x64\*" } | Select-Object -First 1
            if ($dumpbin) {
              $deps = (& $dumpbin.FullName /dependents $exe) -join "`n"
              Write-Host $deps
              if ($deps -match "VCRUNTIME140") {
                throw "mq.exe unexpectedly depends on VCRUNTIME140.dll"
              }
            }
          }

      - name: Verify Windows binary & CLI smoke checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:MQ_DATA_DIR = Join-Path $env:RUNNER_TEMP "mq-win-ci-data"
          New-Item -ItemType Directory -Force -Path $env:MQ_DATA_DIR | Out-Null
          $verOut = (& .\target\release\mq.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $verOut -notmatch "^mq\s+\d+\.\d+") {
            throw "mq.exe --version failed (exit=$LASTEXITCODE, out='$verOut')"
          }
          Write-Host "mq.exe --version => $verOut"
          $helpOut = (& .\target\release\mq.exe --help | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $helpOut -notmatch "Windows") {
            throw "mq.exe --help failed (exit=$LASTEXITCODE)"
          }
          .\target\release\mq.exe launch --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mq.exe launch --help failed" }
          .\target\release\mq.exe instances list
          if ($LASTEXITCODE -ne 0) { throw "mq.exe instances list failed" }
          .\target\release\mq.exe instances create "WinTest 1.20.1" --version 1.20.1 --loader vanilla
          if ($LASTEXITCODE -ne 0) { throw "mq.exe instances create failed" }
          .\target\release\mq.exe instances list
          if ($LASTEXITCODE -ne 0) { throw "mq.exe instances list (2) failed" }
          .\target\release\mq.exe doctor
          if ($LASTEXITCODE -ne 0) { throw "mq.exe doctor failed" }
          .\target\release\mq.exe doctor --install 1.21.1 --json || $true

      - name: Test Windows Inno Setup Installer
        shell: pwsh
        run: pwsh -NoProfile -File scripts\ci\test-windows-installer.ps1

      - name: Test install.ps1
        shell: pwsh
        run: pwsh -NoProfile -File scripts\ci\test-install-ps1.ps1

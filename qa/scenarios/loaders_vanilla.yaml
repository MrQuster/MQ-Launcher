name: loaders_vanilla
description: Create and install Vanilla instances (1.7.10, 1.8.9, 1.12.2, 1.16.5, 1.18.2, 1.20.1, 1.21.11, 26.3) via UI modal
window:
  width: 1024
  height: 640
steps:
  - wait_for:
      label: "Создать инстанс"
      timeout_ms: 15000
  - wait_idle:
      timeout_ms: 5000
      frames: 3
  - screenshot: "vanilla_00_initial.png"

  # 1. Vanilla 1.7.10
  - click: { label: "Создать инстанс" }
  - wait_for: { label: "Обновить", timeout_ms: 15000 }
  - wait_idle: { timeout_ms: 5000, frames: 3 }
  - click: { x: 302, y: 202 }
  - click: { x: 400, y: 340 }
  - type: { text: "1.7.10", clear: false }
  - wait_idle: { timeout_ms: 5000, frames: 3 }
  - click: { x: 400, y: 390 }
  - wait_idle: { timeout_ms: 5000, frames: 2 }
  - screenshot: "vanilla_01_modal_1_7_10.png"
  - click: { id: "button_0759ba93" }
  - wait_for: { label: "Создать инстанс", timeout_ms: 10000 }


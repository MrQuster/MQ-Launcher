name: launch_smoke
description: UI instance creation and console tab smoke scenario for game-launch QA (see scripts/qa/game_launch_helper.py for live Minecraft launch, OCR, parallel, and signal-crash verification).
deterministic: true
viewport:
  width: 1280
  height: 800
steps:
  - goto: instances
  - wait_idle:
      timeout_ms: 5000
      frames: 3
  - screenshot: {}
  - click:
      label: "Создать инстанс"
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - click:
      label: "Создать"
  - wait_for:
      label: "Моды"
      timeout_ms: 10000
  - screenshot: {}
  - click:
      label: "Моды"
  - wait_for:
      label: "Консоль"
      timeout_ms: 5000
  - click:
      label: "Консоль"
  - wait_for:
      label: "Копировать лог"
      timeout_ms: 5000
  - screenshot: {}
  - dump_ui: {}
  - state: {}
  - quit: {}

name: content_preflight
description: Create a real instance via UI and verify Mods preflight/unused-deps, Shaders (OpenGL), and ResourcePacks tabs.
deterministic: true
viewport:
  width: 1280
  height: 800
steps:
  - frame_stats: reset
  - goto:
      tab: "instances"
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - click:
      label: "Создать инстанс"
  - wait_for:
      label: "Отмена"
      timeout_ms: 5000
  - click:
      label: "Создать инстанс"
  - wait_for:
      label: "Детали"
      timeout_ms: 8000
  - click:
      label: "Детали"
  - wait_for:
      label: "Моды"
      timeout_ms: 5000
  - click:
      label: "Моды"
  - wait_for:
      label: "Проверить зависимости"
      timeout_ms: 5000
  - click:
      label: "Проверить зависимости"
  - wait_for:
      label: "Удалить неиспользуемые"
      timeout_ms: 5000
  - screenshot: {}
  - click:
      label: "Удалить неиспользуемые"
  - screenshot: {}
  - click:
      label: "Шейдеры"
  - wait_for:
      label: "Ресурспаки"
      timeout_ms: 5000
  - screenshot: {}
  - click:
      label: "Ресурспаки"
  - wait_for:
      label: "Шейдеры"
      timeout_ms: 5000
  - screenshot: {}
  - dump_ui: {}
  - frame_stats: get
  - state: {}
  - quit: {}

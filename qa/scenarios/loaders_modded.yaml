name: loaders_modded
description: Create and install Fabric (26.3, 1.20.1), Quilt (26.3), Forge (1.20.1, 1.12.2), and NeoForge (26.3) instances via UI modal
window:
  width: 1024
  height: 640
steps:
  - wait_for:
      label: "Создать инстанс"
      timeout_ms: 15000
  - wait_idle:
      timeout_ms: 5000
      frames: 3

  # 1. Fabric 26.3 (latest)
  - click: { label: "Создать инстанс" }
  - wait_for: { label: "Обновить", timeout_ms: 15000 }
  - wait_idle: { timeout_ms: 5000, frames: 3 }
  - click: { x: 366, y: 202 }
  - click: { x: 400, y: 340 }
  - type: { text: "26.3", clear: false }
  - wait_idle: { timeout_ms: 5000, frames: 3 }
  - click: { x: 400, y: 390 }
  - wait_idle: { timeout_ms: 5000, frames: 3 }
  - screenshot: "modded_01_fabric_26_3.png"
  - click: { id: "button_0759ba93" }
  - wait_for: { label: "Создать инстанс", timeout_ms: 10000 }

  # 2. Fabric 1.20.1
  - click: { label: "Создать инстанс" }
  - wait_for: { label: "Обновить", timeout_ms: 15000 }

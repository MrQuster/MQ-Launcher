  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - goto:
      tab: Settings
      section: Launch
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - goto:
      tab: Settings

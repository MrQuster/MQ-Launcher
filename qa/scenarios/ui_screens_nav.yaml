      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - click:
      label: "Офлайн (только ник)"
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - goto:
      tab: Settings

name: smoke
description: Basic QA smoke scenario exercising launch, dump_ui, settings navigation, search input, frame_stats, and clean quit.
deterministic: true
viewport:
  width: 1280
  height: 800
steps:
  - frame_stats: reset
  - dump_ui: {}
  - screenshot: {}
  - click:
      label: "Настройки"
  - wait_idle:
      timeout_ms: 5000
      frames: 3
  - screenshot: {}
  - dump_ui: {}
  - click:
      label: "Язык интерфейса"
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - type:
      id: "mc_locale_search"
      text: "Русский"
      clear: true
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - screenshot: {}
  - dump_ui: {}
  - frame_stats: get
  - state: {}
  - quit: {}

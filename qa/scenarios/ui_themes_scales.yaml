name: ui_themes_scales
description: Sweep all 6 theme presets and UI scales (1.0, 1.5, 2.0) across Instances and Settings.
deterministic: true
steps:
  - frame_stats: reset
  - set_flag:
      name: demo_instances
      value: true
  - set_scale:
      scale: 1.0
  - set_theme:
      preset: MatteDark
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - set_theme:
      preset: PrismClassicDark
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - set_theme:
      preset: ModrinthEmerald
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - set_theme:
      preset: CatppuccinMocha
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - set_theme:
      preset: Nord
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - set_theme:
      preset: LightClean
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - set_theme:
      preset: LiquidGlass
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - set_theme:
      preset: Translucent
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - goto:
      tab: Settings
      section: Customization
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - set_theme:
      preset: MatteDark
  - set_scale:
      scale: 1.5
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - set_scale:
      scale: 2.0
  - wait_idle:
      timeout_ms: 5000
      frames: 2
  - dump_ui: {}
  - screenshot: {}
  - set_scale:
      scale: 1.0
  - frame_stats: get
  - quit: {}
